services:
  # Servicio de PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: turnos_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: turnos_user
      POSTGRES_PASSWORD: turnos_pass
      POSTGRES_DB: turnos_app_pg
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - turnos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos_user -d turnos_app_pg"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio de MongoDB
  mongodb:
    image: mongo:7.0
    container_name: turnos_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"  # Usar puerto 27018 externamente para evitar conflictos con MongoDB local
    environment:
      MONGO_INITDB_DATABASE: turnos_app
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - turnos-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio de la aplicación Node.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turnos_app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - TZ=UTC
      - NODE_ENV=production
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/turnos_app
      - DATABASE_URL=postgresql://turnos_user:turnos_pass@postgres:5432/turnos_app_pg
      - SESSION_SECRET=sistema_gestion_secret_production_2025
      - ALLOWED_ORIGINS=http://localhost:3001,http://10.250.10.9:3001
      - ADMIN_INIT_PASSWORD=SuperAdmin2025!
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - turnos-network
    volumes:
      - ./backend/utils:/app/utils
      - ./backend/uploads:/app/uploads
      - ./frontend:/app/public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/auth/verificar-sesion"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  turnos-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  postgres_data:
    driver: local
