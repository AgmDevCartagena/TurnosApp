<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Áreas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; min-height: 100vh; }

    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
    .header h1 { font-size: 1.5em; }
    .header p  { font-size: 0.9em; opacity: 0.85; margin-top: 2px; }
    .header-actions { display: flex; gap: 10px; }
    .btn { padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9em; font-weight: 600; transition: all .2s; }
    .btn-primary { background: white; color: #667eea; }
    .btn-primary:hover { background: #e8eaf6; }
    .btn-back { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
    .btn-back:hover { background: rgba(255,255,255,0.25); }

    .content { max-width: 1100px; margin: 32px auto; padding: 0 20px; }

    .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 0.9em; font-weight: 500; }
    .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .alert-error   { background: #fce4ec; color: #c62828; border: 1px solid #f48fb1; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); text-align: center; }
    .stat-card .number { font-size: 2.2em; font-weight: 700; color: #667eea; }
    .stat-card .label  { font-size: 0.85em; color: #888; margin-top: 4px; }

    /* Card tabla */
    .card { background: white; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; }
    .card-header { padding: 20px 24px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .card-header h2 { font-size: 1.1em; color: #333; }

    table { width: 100%; border-collapse: collapse; }
    th { background: #f8f9ff; color: #555; font-size: 0.82em; text-transform: uppercase; letter-spacing: .05em; padding: 12px 16px; text-align: left; }
    td { padding: 14px 16px; border-top: 1px solid #f0f0f0; vertical-align: middle; font-size: 0.92em; color: #333; }
    tr:hover td { background: #fafbff; }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.78em; font-weight: 600; }
    .badge-activo   { background: #e8f5e9; color: #2e7d32; }
    .badge-inactivo { background: #fce4ec; color: #c62828; }

    .code-tag { display: inline-block; background: #e8eaf6; color: #5c6bc0; border-radius: 5px; padding: 2px 8px; font-size: 0.78em; font-weight: 600; font-family: monospace; }

    .btn-sm { padding: 5px 11px; font-size: 0.8em; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; transition: all .15s; }
    .btn-edit   { background: #e8eaf6; color: #3949ab; }
    .btn-edit:hover { background: #c5cae9; }
    .btn-toggle { background: #e8f5e9; color: #2e7d32; }
    .btn-toggle:hover { background: #c8e6c9; }
    .btn-toggle.inactivar { background: #fff3e0; color: #e65100; }
    .btn-toggle.inactivar:hover { background: #ffe0b2; }
    .btn-del    { background: #fce4ec; color: #c62828; }
    .btn-del:hover { background: #f8bbd0; }

    .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
    .empty-state .icon { font-size: 3em; margin-bottom: 12px; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; justify-content: center; align-items: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; border-radius: 16px; width: 480px; max-width: 95vw; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: slideIn .2s ease; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { padding: 22px 24px 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 1.1em; color: #333; }
    .modal-close { background: none; border: none; font-size: 1.4em; cursor: pointer; color: #999; }
    .modal-close:hover { color: #333; }
    .modal-body { padding: 22px 24px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 10px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85em; font-weight: 600; color: #555; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9em; transition: border .2s; font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.12); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .btn-cancel { background: #f0f0f0; color: #555; }
    .btn-cancel:hover { background: #e0e0e0; }
    .btn-save { background: linear-gradient(135deg,#667eea,#764ba2); color: white; }
    .btn-save:hover { opacity: 0.9; }

    .modal-alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; display: none; font-size: 0.88em; background: #fce4ec; color: #c62828; border: 1px solid #f48fb1; }

    .loading-spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #f0f0f0; border-top-color: #667eea; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Selector empresa (super_admin) */
    .empresa-selector-bar { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 16px 22px; margin-bottom: 22px; display: none; align-items: center; gap: 14px; flex-wrap: wrap; }
    .empresa-selector-bar label { font-size: 0.88em; font-weight: 600; color: #555; white-space: nowrap; }
    .empresa-selector-bar select { padding: 9px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9em; min-width: 260px; background: white; cursor: pointer; }
    .empresa-selector-bar select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.12); }
    .empresa-badge { background: linear-gradient(135deg,#667eea,#764ba2); color: white; padding: 5px 14px; border-radius: 20px; font-size: 0.82em; font-weight: 600; white-space: nowrap; }
    .select-prompt { text-align: center; padding: 60px 20px; color: #aaa; }
    .select-prompt .icon { font-size: 3em; margin-bottom: 14px; }
    .select-prompt p { font-size: 1em; }
    .select-prompt small { font-size: 0.85em; color: #bbb; display: block; margin-top: 6px; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>🏢 Gestión de Áreas</h1>
    <p id="info-usuario">Cargando...</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" onclick="abrirModalCrear()">➕ Nueva Área</button>
    <button class="btn btn-back" onclick="window.location.href='/dashboard.html'">← Dashboard</button>
  </div>
</div>

<div class="content">
  <div id="alert" class="alert"></div>

  <!-- Selector de empresa (solo super_admin) -->
  <div class="empresa-selector-bar" id="empresa-selector-bar">
    <label>🏢 Empresa:</label>
    <select id="selector-empresa" onchange="onEmpresaChange()">
      <option value="">— Selecciona una empresa —</option>
    </select>
    <span class="empresa-badge" id="empresa-badge" style="display:none;"></span>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="number" id="stat-total">–</div><div class="label">Áreas Total</div></div>
    <div class="stat-card"><div class="number" id="stat-activas">–</div><div class="label">Activas</div></div>
    <div class="stat-card"><div class="number" id="stat-inactivas">–</div><div class="label">Inactivas</div></div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>📋 Listado de Áreas</h2>
      <div style="display:flex;gap:10px;align-items:center;">
        <select id="filtro-estado" onchange="aplicarFiltros()" style="padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:0.88em;">
          <option value="">Todos los estados</option>
          <option value="activo">Solo activas</option>
          <option value="inactivo">Solo inactivas</option>
        </select>
        <input type="text" id="buscador" placeholder="🔍 Buscar área..." style="padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:0.88em;width:220px;" oninput="aplicarFiltros()">
      </div>
    </div>
    <div id="tabla-container">
      <div class="empty-state"><div class="loading-spinner"></div> Cargando...</div>
    </div>
  </div>
</div>

<!-- Modal crear / editar área -->
<div class="modal-overlay" id="modal-area">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-titulo">Nueva Área</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-alert" id="modal-alert"></div>
      <input type="hidden" id="campo-id">

      <div class="form-group">
        <label>Nombre del área *</label>
        <input id="campo-nombre" type="text" placeholder="Ej: OPERACIONES">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Código (opcional)</label>
          <input id="campo-codigo" type="text" placeholder="Ej: OPE">
        </div>
        <div class="form-group" id="grupo-estado" style="display:none;">
          <label>Estado</label>
          <select id="campo-estado">
            <option value="activo">Activo</option>
            <option value="inactivo">Inactivo</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Descripción (opcional)</label>
        <textarea id="campo-descripcion" placeholder="Descripción del área..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-save" id="btn-guardar" onclick="guardarArea()">💾 Guardar</button>
    </div>
  </div>
</div>

<script>
  let areas = [];
  let modoEdicion = false;
  let usuarioActual = null;          // sesión completa
  let empresaSeleccionadaId = null;  // para super_admin

  // ── Init ────────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    usuarioActual = await verificarSesion();
    if (!usuarioActual) return;

    if (usuarioActual.rol === 'super_admin') {
      document.getElementById('empresa-selector-bar').style.display = 'flex';
      await cargarSelectorEmpresas();
      // No cargamos áreas hasta que el super_admin elija empresa
      mostrarPromptSeleccion();
    } else {
      await cargarAreas();
    }
  });

  async function verificarSesion() {
    try {
      const res = await fetch('/api/auth/verificar-sesion');
      const data = await res.json();
      if (!data.autenticado) { window.location.href = '/login.html'; return null; }
      const rolesPermitidos = ['admin', 'super_admin'];
      if (!rolesPermitidos.includes(data.usuario.rol)) {
        mostrarAlerta('No tienes permisos para gestionar áreas.', 'error');
        setTimeout(() => window.location.href = '/dashboard.html', 2000);
        return null;
      }
      document.getElementById('info-usuario').textContent = `${data.usuario.nombre} · ${data.usuario.rol}`;
      return data.usuario;
    } catch {
      window.location.href = '/login.html';
      return null;
    }
  }

  // ── Selector de empresas (super_admin) ─────────────────────────────────────
  async function cargarSelectorEmpresas() {
    try {
      const res  = await fetch('/api/empresas');
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || 'Error cargando empresas');

      const select = document.getElementById('selector-empresa');
      // Mantener la opción vacía inicial
      select.innerHTML = '<option value="">— Selecciona una empresa —</option>';

      (data.empresas || []).forEach(emp => {
        const opt = document.createElement('option');
        opt.value = emp._id;
        opt.textContent = `${emp.nombre}${emp.estado !== 'activa' ? ' (inactiva)' : ''}`;
        select.appendChild(opt);
      });
    } catch (e) {
      mostrarAlerta('Error cargando empresas: ' + e.message, 'error');
    }
  }

  async function onEmpresaChange() {
    const select = document.getElementById('selector-empresa');
    empresaSeleccionadaId = select.value || null;
    const badge  = document.getElementById('empresa-badge');

    if (!empresaSeleccionadaId) {
      badge.style.display = 'none';
      mostrarPromptSeleccion();
      actualizarStats([]);
      return;
    }

    const nombreEmpresa = select.options[select.selectedIndex].textContent;
    badge.textContent   = nombreEmpresa;
    badge.style.display = 'inline-block';

    await cargarAreas();
  }

  function mostrarPromptSeleccion() {
    document.getElementById('tabla-container').innerHTML = `
      <div class="select-prompt">
        <div class="icon">🏢</div>
        <p>Selecciona una empresa para gestionar sus áreas</p>
        <small>Cada empresa administra su propio catálogo de áreas</small>
      </div>`;
    document.getElementById('stat-total').textContent    = '–';
    document.getElementById('stat-activas').textContent  = '–';
    document.getElementById('stat-inactivas').textContent = '–';
  }

  // ── Cargar áreas ────────────────────────────────────────────────────────────
  async function cargarAreas() {
    document.getElementById('tabla-container').innerHTML =
      '<div class="empty-state"><div class="loading-spinner"></div> Cargando...</div>';
    try {
      let url = '/api/areas';
      if (usuarioActual.rol === 'super_admin' && empresaSeleccionadaId) {
        url += `?empresaId=${empresaSeleccionadaId}`;
      }

      const res = await fetch(url);
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) { window.location.href = '/login.html'; return; }
        throw new Error(`Error ${res.status}`);
      }
      const data = await res.json();
      areas = data.areas || [];
      actualizarStats(areas);
      renderTabla(areas);
    } catch (e) {
      mostrarAlerta('Error cargando áreas: ' + e.message, 'error');
      document.getElementById('tabla-container').innerHTML =
        '<div class="empty-state"><div class="icon">⚠️</div><p>No se pudieron cargar las áreas</p></div>';
    }
  }

  function actualizarStats(lista) {
    document.getElementById('stat-total').textContent     = lista.length;
    document.getElementById('stat-activas').textContent   = lista.filter(a => a.estado === 'activo').length;
    document.getElementById('stat-inactivas').textContent = lista.filter(a => a.estado === 'inactivo').length;
  }

  function aplicarFiltros() {
    const q      = document.getElementById('buscador').value.toLowerCase();
    const estado = document.getElementById('filtro-estado').value;
    const filtradas = areas.filter(a => {
      const coincideTexto = !q ||
        a.nombre?.toLowerCase().includes(q) ||
        a.codigo?.toLowerCase().includes(q) ||
        a.descripcion?.toLowerCase().includes(q);
      const coincideEstado = !estado || a.estado === estado;
      return coincideTexto && coincideEstado;
    });
    renderTabla(filtradas);
  }

  // ── Render tabla ────────────────────────────────────────────────────────────
  function renderTabla(lista) {
    const c = document.getElementById('tabla-container');
    if (!lista.length) {
      c.innerHTML = '<div class="empty-state"><div class="icon">🏢</div><p>No hay áreas registradas para esta empresa</p></div>';
      return;
    }

    const esSuperAdmin = usuarioActual?.rol === 'super_admin';

    const encabezadoEmpresa = esSuperAdmin ? '<th>Empresa</th>' : '';
    const filas = lista.map(a => {
      const esActiva   = a.estado === 'activo';
      const empNombre  = a.empresaId?.nombre || '—';
      const celdaEmpresa = esSuperAdmin
        ? `<td style="font-size:0.85em;color:#667eea;font-weight:600;">${empNombre}</td>`
        : '';

      return `<tr>
        <td><strong>${a.nombre}</strong></td>
        <td>${a.codigo ? `<span class="code-tag">${a.codigo}</span>` : '<span style="color:#ccc">—</span>'}</td>
        <td style="max-width:220px;color:#666;">${a.descripcion || '<span style="color:#ccc">—</span>'}</td>
        ${celdaEmpresa}
        <td><span class="badge badge-${a.estado}">${a.estado}</span></td>
        <td style="white-space:nowrap">
          <button class="btn-sm btn-edit" onclick="abrirModalEditar('${a.id || a._id}')">✏️ Editar</button>
          <button class="btn-sm btn-toggle ${esActiva ? 'inactivar' : ''}"
            onclick="toggleEstado('${a.id || a._id}', '${esActiva ? 'inactivo' : 'activo'}')">
            ${esActiva ? '⏸ Inactivar' : '▶ Activar'}
          </button>
          <button class="btn-sm btn-del" onclick="eliminarArea('${a.id || a._id}', '${a.nombre}')">🗑️</button>
        </td>
      </tr>`;
    }).join('');

    c.innerHTML = `<table>
      <thead><tr>
        <th>Nombre</th><th>Código</th><th>Descripción</th>
        ${encabezadoEmpresa}<th>Estado</th><th>Acciones</th>
      </tr></thead>
      <tbody>${filas}</tbody>
    </table>`;
  }

  // ── Modal crear ─────────────────────────────────────────────────────────────
  function abrirModalCrear() {
    if (usuarioActual?.rol === 'super_admin' && !empresaSeleccionadaId) {
      mostrarAlerta('⚠️ Selecciona una empresa antes de crear un área.', 'error');
      return;
    }
    modoEdicion = false;
    document.getElementById('modal-titulo').textContent = '➕ Nueva Área';
    document.getElementById('campo-id').value = '';
    document.getElementById('campo-nombre').value = '';
    document.getElementById('campo-codigo').value = '';
    document.getElementById('campo-descripcion').value = '';
    document.getElementById('grupo-estado').style.display = 'none';
    ocultarModalAlerta();
    document.getElementById('modal-area').classList.add('open');
  }

  // ── Modal editar ────────────────────────────────────────────────────────────
  function abrirModalEditar(id) {
    const a = areas.find(x => (x.id || x._id) === id);
    if (!a) return;
    modoEdicion = true;
    document.getElementById('modal-titulo').textContent = `✏️ Editar: ${a.nombre}`;
    document.getElementById('campo-id').value = a.id || a._id;
    document.getElementById('campo-nombre').value = a.nombre;
    document.getElementById('campo-codigo').value = a.codigo || '';
    document.getElementById('campo-descripcion').value = a.descripcion || '';
    document.getElementById('campo-estado').value = a.estado;
    document.getElementById('grupo-estado').style.display = 'block';
    ocultarModalAlerta();
    document.getElementById('modal-area').classList.add('open');
  }

  function cerrarModal() { document.getElementById('modal-area').classList.remove('open'); }

  // ── Guardar área ────────────────────────────────────────────────────────────
  async function guardarArea() {
    const nombre = document.getElementById('campo-nombre').value.trim();
    if (!nombre) { mostrarModalAlerta('El nombre del área es obligatorio.'); return; }

    const payload = {
      nombre,
      codigo:      document.getElementById('campo-codigo').value.trim(),
      descripcion: document.getElementById('campo-descripcion').value.trim()
    };
    if (modoEdicion) {
      payload.estado = document.getElementById('campo-estado').value;
    } else if (usuarioActual?.rol === 'super_admin' && empresaSeleccionadaId) {
      payload.empresaId = empresaSeleccionadaId;
    }

    const id     = document.getElementById('campo-id').value;
    const url    = modoEdicion ? `/api/areas/${id}` : '/api/areas';
    const method = modoEdicion ? 'PUT' : 'POST';

    const btn = document.getElementById('btn-guardar');
    btn.disabled = true; btn.textContent = 'Guardando...';

    try {
      const res  = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || `Error ${res.status}`);
      cerrarModal();
      mostrarAlerta(modoEdicion ? '✅ Área actualizada.' : '✅ Área creada exitosamente.', 'success');
      await cargarAreas();
    } catch (e) {
      mostrarModalAlerta(e.message);
    } finally {
      btn.disabled = false; btn.textContent = '💾 Guardar';
    }
  }

  // ── Toggle estado ───────────────────────────────────────────────────────────
  async function toggleEstado(id, nuevoEstado) {
    const accion = nuevoEstado === 'inactivo' ? 'inactivar' : 'activar';
    if (!confirm(`¿Seguro que deseas ${accion} esta área?`)) return;
    try {
      const res  = await fetch(`/api/areas/${id}/estado`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado: nuevoEstado })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || `Error ${res.status}`);
      mostrarAlerta(`✅ Área ${nuevoEstado === 'activo' ? 'activada' : 'inactivada'} correctamente.`, 'success');
      await cargarAreas();
    } catch (e) {
      mostrarAlerta('Error: ' + e.message, 'error');
    }
  }

  // ── Eliminar área ───────────────────────────────────────────────────────────
  async function eliminarArea(id, nombre) {
    if (!confirm(`⚠️ ¿Eliminar el área "${nombre}"?\n\nEsta acción no se puede deshacer.\nSi tiene usuarios o turnos asociados, se bloqueará automáticamente.`)) return;
    try {
      const res  = await fetch(`/api/areas/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok || !data.success) {
        if (res.status === 409) {
          mostrarAlerta(`⚠️ ${data.error}`, 'error');
        } else {
          throw new Error(data.error || `Error ${res.status}`);
        }
        return;
      }
      mostrarAlerta('✅ Área eliminada correctamente.', 'success');
      await cargarAreas();
    } catch (e) {
      mostrarAlerta('Error: ' + e.message, 'error');
    }
  }

  // ── Alertas ─────────────────────────────────────────────────────────────────
  function mostrarAlerta(msg, tipo = 'success') {
    const el = document.getElementById('alert');
    el.textContent = msg; el.className = `alert alert-${tipo}`; el.style.display = 'block';
    if (tipo === 'success') setTimeout(() => el.style.display = 'none', 4000);
  }
  function mostrarModalAlerta(msg) {
    const el = document.getElementById('modal-alert');
    el.textContent = msg; el.style.display = 'block';
  }
  function ocultarModalAlerta() { document.getElementById('modal-alert').style.display = 'none'; }

  document.getElementById('modal-area').addEventListener('click', e => {
    if (e.target === e.currentTarget) cerrarModal();
  });
</script>
</body>
</html>
