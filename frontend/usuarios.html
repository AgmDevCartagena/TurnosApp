<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; min-height: 100vh; }

        /* ── Multiempresa additions ── */
        .empresa-card { border: 2px solid #e0e0e0; border-radius: 10px; padding: 12px 16px; cursor: pointer; transition: all .18s; display: flex; align-items: center; gap: 10px; background: #fafafa; }
        .empresa-card:hover { border-color: #667eea; background: #f0f2ff; }
        .empresa-card.selected { border-color: #667eea; background: #eef0ff; }
        .empresa-card input[type=checkbox] { width: 17px; height: 17px; accent-color: #667eea; flex-shrink: 0; }
        .empresa-card .emp-nombre { font-weight: 600; font-size: 0.9em; color: #333; }
        .empresa-card .emp-rol { font-size: 0.76em; color: #888; margin-top: 2px; }
        #grid-empresas { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; max-height: 220px; overflow-y: auto; padding: 4px 2px; }

        .acordeon { border: 1px solid #e0e0e0; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
        .acordeon-header { padding: 12px 16px; background: #f5f6ff; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .acordeon-header:hover { background: #eaecff; }
        .acordeon-header .emp-tag { font-weight: 700; color: #3949ab; font-size: 0.92em; }
        .acordeon-header .chevron { transition: transform .2s; font-size: 0.85em; color: #888; }
        .acordeon-header.open .chevron { transform: rotate(180deg); }
        .acordeon-body { padding: 16px; display: none; border-top: 1px solid #eee; background: white; }
        .acordeon-body.open { display: block; }

        .permisos-grupo { margin-bottom: 14px; }
        .permisos-grupo-titulo { font-size: 0.78em; font-weight: 700; color: #667eea; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #e8eaf6; }
        .pill-sm { display: inline-flex; align-items: center; gap: 4px; padding: 4px 11px; border: 1.5px solid #ddd; border-radius: 14px; cursor: pointer; font-size: 0.78em; font-weight: 600; color: #666; transition: all .15s; user-select: none; margin: 2px; }
        .pill-sm:hover { border-color: #667eea; color: #667eea; }
        .pill-sm.active { border-color: #667eea; background: #667eea; color: white; }
        .pill-sm input { display: none; }
        .section-title { font-size: 0.8em; font-weight: 700; color: #444; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: #eee; }

        .badge-empresa { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.72em; font-weight: 700; background: #e8eaf6; color: #3949ab; margin: 1px; }
        .badge-activo   { background: #e8f5e9; color: #2e7d32; }
        .badge-inactivo { background: #fce4ec; color: #c62828; }
        .toggle-activo { cursor: pointer; padding: 3px 10px; border-radius: 12px; font-size: 0.8em; font-weight: 600; border: none; transition: all .15s; }
        .modal { background: white; border-radius: 16px; width: 800px; max-width: 97vw; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: slideIn .2s ease; margin-bottom: 40px; }
        .search-inline { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.85em; margin-bottom: 10px; }
        .search-inline:focus { outline: none; border-color: #667eea; }

        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
        .header h1 { font-size: 1.5em; }
        .header p  { font-size: 0.9em; opacity: 0.85; margin-top: 2px; }
        .header-actions { display: flex; gap: 10px; }
        .btn { padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9em; font-weight: 600; transition: all .2s; }
        .btn-primary { background: white; color: #667eea; }
        .btn-primary:hover { background: #e8eaf6; }
        .btn-back { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); }
        .btn-back:hover { background: rgba(255,255,255,0.25); }

        .content { max-width: 1100px; margin: 32px auto; padding: 0 20px; }

        .msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 0.9em; font-weight: 500; }
        .msg.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .msg.error   { background: #fce4ec; color: #c62828; border: 1px solid #f48fb1; }

        /* ── Card ── */
        .card { background: white; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 28px; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .card-header h2 { font-size: 1.1em; color: #333; }

        /* ── Tabla ── */
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9ff; color: #555; font-size: 0.82em; text-transform: uppercase; letter-spacing: .05em; padding: 12px 16px; text-align: left; }
        td { padding: 14px 16px; border-top: 1px solid #f0f0f0; vertical-align: middle; font-size: 0.92em; color: #333; }
        tr:hover td { background: #fafbff; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.8em; font-weight: 600; color: white; }
        .badge-admin     { background: #667eea; }
        .badge-super_admin { background: #764ba2; }
        .badge-usuario   { background: #43a047; }
        .badge-consulta  { background: #757575; }
        .badge-gestor_turnos { background: #e67e22; }
        .badge-gestor_nomina { background: #16a085; }

        .btn-sm { padding: 5px 11px; font-size: 0.8em; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; transition: all .15s; }
        .btn-edit   { background: #e8eaf6; color: #3949ab; }
        .btn-edit:hover { background: #c5cae9; }
        .btn-pass   { background: #e8f5e9; color: #2e7d32; }
        .btn-pass:hover { background: #c8e6c9; }
        .btn-del    { background: #fce4ec; color: #c62828; }
        .btn-del:hover { background: #f8bbd0; }

        /* ── Modal ── */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; justify-content: center; align-items: flex-start; padding-top: 40px; overflow-y: auto; }
        .modal-overlay.open { display: flex; }
        .modal { background: white; border-radius: 16px; width: 580px; max-width: 95vw; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: slideIn .2s ease; margin-bottom: 40px; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { padding: 22px 24px 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 1.1em; color: #333; }
        .modal-close { background: none; border: none; font-size: 1.4em; cursor: pointer; color: #999; }
        .modal-close:hover { color: #333; }
        .modal-body { padding: 22px 24px; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid #eee; display: flex; justify-content: flex-end; gap: 10px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85em; font-weight: 600; color: #555; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9em; transition: border .2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.12); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        /* ── Checkboxes ── */
        .check-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
        .check-pill { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border: 2px solid #ddd; border-radius: 20px; cursor: pointer; font-size: 0.85em; font-weight: 600; color: #666; transition: all .2s; user-select: none; }
        .check-pill:hover { border-color: #667eea; color: #667eea; }
        .check-pill.active { border-color: #667eea; background: #667eea; color: white; }
        .check-pill input { display: none; }

        .btn-cancel { background: #f0f0f0; color: #555; }
        .btn-cancel:hover { background: #e0e0e0; }
        .btn-save { background: linear-gradient(135deg,#667eea,#764ba2); color: white; }
        .btn-save:hover { opacity: 0.9; }

        .modal-alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; display: none; font-size: 0.88em; background: #fce4ec; color: #c62828; border: 1px solid #f48fb1; }

        .empty-state { text-align: center; padding: 50px 20px; color: #aaa; }
    </style>
</head>
<body>
<div class="header">
    <div>
        <h1>👥 Gestión de Usuarios</h1>
        <p id="info-usuario">Cargando...</p>
    </div>
    <div class="header-actions">
        <button class="btn btn-primary" onclick="abrirModalCrear()">➕ Nuevo Usuario</button>
        <button class="btn btn-back" onclick="window.location.href='/dashboard.html'">← Dashboard</button>
    </div>
</div>

<div class="content">
    <div id="msg" class="msg"></div>
    <div class="card">
        <div class="card-header">
            <h2>📋 Usuarios Registrados</h2>
            <input type="text" id="buscador" placeholder="🔍 Buscar..." style="padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:0.88em;width:220px;" oninput="filtrarTabla()">
        </div>
        <div id="tabla-container"><div class="empty-state">Cargando usuarios...</div></div>
    </div>
</div>

<!-- Modal crear / editar usuario (multiempresa) -->
<div class="modal-overlay" id="modal-usuario">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-titulo">Nuevo Usuario</h3>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-alert" id="modal-alert"></div>
      <input type="hidden" id="campo-id">

      <!-- ── A. Datos básicos ── -->
      <p class="section-title">📋 Datos básicos</p>
      <div class="form-row">
        <div class="form-group">
          <label>Nombre completo *</label>
          <input id="campo-nombre" type="text" placeholder="Juan Pérez">
        </div>
        <div class="form-group">
          <label>Usuario *</label>
          <input id="campo-username" type="text" placeholder="jperez" autocomplete="off">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input id="campo-correo" type="email" placeholder="juan@empresa.com">
        </div>
        <div class="form-group" id="grupo-password">
          <label>Contraseña *</label>
          <input id="campo-password" type="password" placeholder="Mín. 4 caracteres" autocomplete="new-password">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Rol global del sistema</label>
          <select id="campo-rol">
            <option value="usuario">Usuario</option>
            <option value="admin">Administrador</option>
            <option value="gestor_turnos">Gestor Turnos</option>
            <option value="gestor_nomina">Gestor Nómina</option>
            <option value="consulta">Solo Consulta</option>
            <option value="super_admin" id="opt-super-admin" style="display:none">Super Admin</option>
          </select>
        </div>
        <div class="form-group" id="grupo-estado-usuario" style="display:none">
          <label>Estado</label>
          <select id="campo-activo">
            <option value="true">Activo</option>
            <option value="false">Inactivo</option>
          </select>
        </div>
      </div>

      <!-- ── B. Empresas asignadas ── -->
      <p class="section-title" style="margin-top:18px;">🏢 Empresas asignadas</p>
      <input class="search-inline" id="buscador-empresas-modal" placeholder="🔍 Buscar empresa..." oninput="filtrarEmpresasModal()">
      <div id="grid-empresas">
        <span style="color:#aaa;font-size:0.85em;">Cargando empresas...</span>
      </div>

      <!-- ── C. Configuración por empresa (acordeón) ── -->
      <div id="seccion-config-empresas" style="margin-top:18px;display:none">
        <p class="section-title">⚙️ Configuración por empresa</p>
        <div id="acordeones-empresas"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-save" id="btn-guardar" onclick="guardarUsuario()">💾 Guardar</button>
    </div>
  </div>
</div>

<!-- Modal cambiar contraseña -->
<div class="modal-overlay" id="modal-password">
  <div class="modal" style="width:420px;">
    <div class="modal-header">
      <h3 id="pass-titulo">Cambiar Contraseña</h3>
      <button class="modal-close" onclick="cerrarModalPass()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-alert" id="pass-alert"></div>
      <input type="hidden" id="pass-user-id">
      <div class="form-group">
        <label id="pass-label">Nueva contraseña</label>
        <input id="campo-nueva-pass" type="password" placeholder="Mínimo 4 caracteres">
      </div>
      <div class="form-group">
        <label>Confirmar contraseña</label>
        <input id="campo-conf-pass" type="password" placeholder="Repite la contraseña">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="cerrarModalPass()">Cancelar</button>
      <button class="btn btn-save" id="btn-guardar-pass" onclick="guardarPassword()">🔑 Cambiar</button>
    </div>
  </div>
</div>

<script>
  // ── Estado global ──────────────────────────────────────────────────────────
  let usuarios         = [];
  let modoEdicion      = false;
  let sesionActual     = null;
  let todasLasEmpresas = [];
  let todosLosRoles    = [];
  let todosLosPermisos = {};   // { modulo: [permiso, ...] }
  let configPorEmpresa = {};   // { empresaId: { rolId, modulos[], areas[], permisos[] } }
  const ICONOS_MOD = { turnos:'📅', nomina:'💰', usuarios:'👥', parametros:'⚙️', reportes:'📊', empresas:'🏢', areas:'📍' };

  // ── Auth ──────────────────────────────────────────────────────────────────
  async function verificarSesion() {
    try {
      const res = await fetch('/api/auth/verificar-sesion');
      const data = await res.json();
      if (!data.autenticado) { window.location.href = '/login.html'; return null; }
      if (!['admin', 'super_admin'].includes(data.usuario.rol)) {
        showMsg('No tienes permisos para gestionar usuarios.', 'error');
        setTimeout(() => window.location.href = '/dashboard.html', 2000);
        return null;
      }
      document.getElementById('info-usuario').textContent =
        `${data.usuario.nombre} · ${data.usuario.rol}` +
        (data.usuario.nombreEmpresa ? ` · ${data.usuario.nombreEmpresa}` : '');
      sesionActual = data.usuario;
      if (sesionActual.rol === 'super_admin') {
        document.getElementById('opt-super-admin').style.display = '';
      }
      return data.usuario;
    } catch { window.location.href = '/login.html'; return null; }
  }

  // ── Cargar usuarios ────────────────────────────────────────────────────────
  async function cargarUsuarios() {
    try {
      const res = await fetch('/api/auth/usuarios');
      if (!res.ok) { if (res.status === 401) window.location.href = '/login.html'; throw new Error(`Error ${res.status}`); }
      const data = await res.json();
      if (data.success) { usuarios = data.usuarios; renderTabla(usuarios); }
      else showMsg(data.error || 'Error al cargar usuarios.', 'error');
    } catch (err) { showMsg('Error de red: ' + err.message, 'error'); }
  }

  function filtrarTabla() {
    const q = document.getElementById('buscador').value.toLowerCase();
    renderTabla(usuarios.filter(u =>
      u.nombre?.toLowerCase().includes(q) ||
      u.username?.toLowerCase().includes(q) ||
      (u.correo || '').toLowerCase().includes(q)
    ));
  }

  // ── Render tabla ───────────────────────────────────────────────────────────
  function renderTabla(lista) {
    const c = document.getElementById('tabla-container');
    if (!lista.length) { c.innerHTML = '<div class="empty-state">No hay usuarios registrados.</div>'; return; }
    const esSA = sesionActual?.rol === 'super_admin';
    const filas = lista.map(u => {
      const empresasBadges = (u.empresasAsignadas || []).length > 0
        ? u.empresasAsignadas.map(e => `<span class="badge-empresa">${e.empresaNombre}</span>`).join('')
        : (u.nombreEmpresa ? `<span class="badge-empresa">${u.nombreEmpresa}</span>` : '<span style="color:#ccc">—</span>');
      const estadoBadge = u.activo
        ? `<span class="badge-activo" style="padding:2px 10px;border-radius:10px;font-size:0.8em;font-weight:600;">Activo</span>`
        : `<span class="badge-inactivo" style="padding:2px 10px;border-radius:10px;font-size:0.8em;font-weight:600;">Inactivo</span>`;
      return `<tr style="${!u.activo ? 'opacity:.55' : ''}">
        <td><strong>${u.nombre}</strong>${u.correo ? `<br><small style="color:#888">${u.correo}</small>` : ''}</td>
        <td><code>${u.username}</code></td>
        <td><span class="badge badge-${u.rol}">${u.rol}</span></td>
        <td style="max-width:200px">${empresasBadges}</td>
        <td>${estadoBadge}</td>
        <td style="white-space:nowrap">
          <button class="btn-sm btn-edit" onclick="abrirModalEditar('${u.id}')">✏️ Editar</button>
          <button class="btn-sm btn-pass" onclick="abrirModalPass('${u.id}')">🔑</button>
          <button class="btn-sm" style="background:${u.activo ? '#fff3e0' : '#e8f5e9'};color:${u.activo ? '#e65100' : '#2e7d32'}" onclick="toggleEstado('${u.id}')">${u.activo ? '🔴' : '🟢'}</button>
          <button class="btn-sm btn-del" onclick="eliminarUsuario('${u.id}')">🗑️</button>
        </td>
      </tr>`;
    }).join('');
    c.innerHTML = `<table><thead><tr>
      <th>Nombre</th><th>Usuario</th><th>Rol global</th><th>Empresas</th><th>Estado</th><th>Acciones</th>
    </tr></thead><tbody>${filas}</tbody></table>`;
  }

  // ── Cargar catálogos ───────────────────────────────────────────────────────
  async function cargarEmpresas() {
    try {
      const res  = await fetch('/api/empresas');
      const data = await res.json();
      todasLasEmpresas = (data.empresas || []).filter(e => e.estado === 'activa');
    } catch {}
  }

  async function cargarRoles() {
    try {
      const res = await fetch('/api/auth/roles');
      const data = await res.json();
      todosLosRoles = data.roles || [];
    } catch {}
  }

  async function cargarPermisos() {
    try {
      const res = await fetch('/api/auth/permisos');
      const data = await res.json();
      todosLosPermisos = data.agrupados || {};
    } catch {}
  }

  // ── Render grid de empresas en el modal ────────────────────────────────────
  function renderGridEmpresas(empresasSeleccionadas = []) {
    const grid    = document.getElementById('grid-empresas');
    const empList = sesionActual?.rol === 'super_admin'
      ? todasLasEmpresas
      : todasLasEmpresas.filter(e => e.id === sesionActual?.pgEmpresaId);

    if (!empList.length) {
      grid.innerHTML = '<span style="color:#aaa;font-size:0.85em;">No hay empresas disponibles.</span>';
      return;
    }
    grid.innerHTML = empList.map(e => {
      const cfg    = configPorEmpresa[e.id];
      const selec  = empresasSeleccionadas.includes(e.id);
      const rolLbl = cfg ? (todosLosRoles.find(r => r.id === cfg.rolId)?.nombre || '') : '';
      return `<label class="empresa-card${selec ? ' selected' : ''}" data-id="${e.id}">
        <input type="checkbox" value="${e.id}" ${selec ? 'checked' : ''} onchange="onToggleEmpresa('${e.id}', this.checked)">
        <div><div class="emp-nombre">🏢 ${e.nombre}</div>${rolLbl ? `<div class="emp-rol">Rol: ${rolLbl}</div>` : ''}</div>
      </label>`;
    }).join('');

    // Sincronizar clase selected al hacer click en la card (no solo en el checkbox)
    grid.querySelectorAll('.empresa-card').forEach(card => {
      card.addEventListener('click', function(e) {
        if (e.target.tagName === 'INPUT') return;
        const cb = this.querySelector('input');
        cb.checked = !cb.checked;
        cb.dispatchEvent(new Event('change'));
        this.classList.toggle('selected', cb.checked);
      });
    });
  }

  function filtrarEmpresasModal() {
    const q = document.getElementById('buscador-empresas-modal').value.toLowerCase();
    document.querySelectorAll('#grid-empresas .empresa-card').forEach(card => {
      const nombre = card.querySelector('.emp-nombre').textContent.toLowerCase();
      card.style.display = nombre.includes(q) ? '' : 'none';
    });
  }

  function getEmpresasSeleccionadas() {
    return Array.from(document.querySelectorAll('#grid-empresas input:checked')).map(cb => cb.value);
  }

  // ── Toggle empresa → crear / destruir acordeón ─────────────────────────────
  async function onToggleEmpresa(empresaId, checked) {
    const card = document.querySelector(`.empresa-card[data-id="${empresaId}"]`);
    if (card) card.classList.toggle('selected', checked);

    if (checked) {
      if (!configPorEmpresa[empresaId]) configPorEmpresa[empresaId] = { rolId: '', modulos: [], areas: [], permisos: [] };
      await crearAcordeon(empresaId);
    } else {
      eliminarAcordeon(empresaId);
    }
    const hayConfig = Object.keys(configPorEmpresa).length > 0;
    document.getElementById('seccion-config-empresas').style.display = hayConfig ? '' : 'none';
  }

  async function crearAcordeon(empresaId) {
    const emp = todasLasEmpresas.find(e => e.id === empresaId);
    if (!emp) return;
    const existente = document.getElementById(`acord-${empresaId}`);
    if (existente) { existente.style.display = ''; return; }

    const cfg = configPorEmpresa[empresaId] || { rolId: '', modulos: [], areas: [], permisos: [] };

    // Opciones de rol
    const optsRol = todosLosRoles.map(r =>
      `<option value="${r.id}" ${cfg.rolId === r.id ? 'selected' : ''}>${r.nombre}</option>`
    ).join('');

    // Opciones de módulos
    const TODOS_MODS = ['turnos','nomina','usuarios','parametros','reportes','empresas','areas'];
    const pillsMod = TODOS_MODS.map(m => {
      const activo = cfg.modulos.includes(m);
      return `<label class="pill-sm${activo ? ' active' : ''}" data-val="${m}" data-emp="${empresaId}" data-tipo="modulo">
        <input type="checkbox" value="${m}" ${activo ? 'checked' : ''}>${ICONOS_MOD[m]||m} ${m}
      </label>`;
    }).join('');

    // Áreas (se cargan async)
    const divAreas = `<div class="check-grid" id="areas-${empresaId}" style="margin-top:6px"><span style="color:#aaa;font-size:0.83em;">Cargando áreas...</span></div>`;

    // Permisos agrupados por módulo
    let htmlPermisos = '';
    for (const [mod, perms] of Object.entries(todosLosPermisos)) {
      const pillsPerm = perms.map(p => {
        const activo = cfg.permisos.includes(p.codigo);
        return `<label class="pill-sm${activo ? ' active' : ''}" data-val="${p.codigo}" data-emp="${empresaId}" data-tipo="permiso">
          <input type="checkbox" value="${p.codigo}" ${activo ? 'checked' : ''}>${p.nombre}
        </label>`;
      }).join('');
      htmlPermisos += `<div class="permisos-grupo">
        <div class="permisos-grupo-titulo">${ICONOS_MOD[mod]||''} ${mod}</div>
        <div>${pillsPerm}</div>
      </div>`;
    }

    const acordeon = document.createElement('div');
    acordeon.className = 'acordeon';
    acordeon.id = `acord-${empresaId}`;
    acordeon.innerHTML = `
      <div class="acordeon-header open" onclick="toggleAcordeon('${empresaId}')">
        <span class="emp-tag">🏢 ${emp.nombre}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="acordeon-body open" id="body-${empresaId}">
        <div class="form-group">
          <label class="section-title">Rol en esta empresa</label>
          <select id="rol-emp-${empresaId}" onchange="onCampoEmpresa('${empresaId}','rol',this.value)" style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:0.9em;">
            <option value="">– Seleccione un rol –</option>
            ${optsRol}
          </select>
        </div>
        <div class="form-group">
          <label class="section-title">Módulos</label>
          <div class="check-grid" id="mods-${empresaId}">${pillsMod}</div>
        </div>
        <div class="form-group">
          <label class="section-title" style="display:flex;justify-content:space-between">
            Áreas
            <a href="/areas.html" target="_blank" style="font-size:0.78em;color:#667eea;font-weight:500;">⚙️ Gestionar</a>
          </label>
          ${divAreas}
        </div>
        <div class="form-group">
          <label class="section-title">Permisos específicos <small style="font-weight:400;color:#aaa">(opcionales — heredados del rol)</small></label>
          <div id="perms-${empresaId}">${htmlPermisos}</div>
        </div>
      </div>`;

    document.getElementById('acordeones-empresas').appendChild(acordeon);
    document.getElementById('seccion-config-empresas').style.display = '';
    initPillsDinamicos(acordeon, empresaId);

    // Cargar áreas async
    cargarAreasParaEmpresa(empresaId, cfg.areas || []);
  }

  function eliminarAcordeon(empresaId) {
    const el = document.getElementById(`acord-${empresaId}`);
    if (el) el.remove();
    delete configPorEmpresa[empresaId];
  }

  function toggleAcordeon(empresaId) {
    const header = document.querySelector(`#acord-${empresaId} .acordeon-header`);
    const body   = document.getElementById(`body-${empresaId}`);
    header?.classList.toggle('open');
    body?.classList.toggle('open');
  }

  // ── Cargar áreas de una empresa ────────────────────────────────────────────
  async function cargarAreasParaEmpresa(empresaId, seleccionadas = []) {
    const container = document.getElementById(`areas-${empresaId}`);
    if (!container) return;
    try {
      const res  = await fetch(`/api/areas?estado=activo&empresaId=${empresaId}`);
      const data = await res.json();
      const areas = (data.areas || []).filter(a => a.empresaId === empresaId);
      if (!areas.length) {
        container.innerHTML = '<span style="color:#aaa;font-size:0.83em;">No hay áreas activas en esta empresa.</span>';
        return;
      }
      container.innerHTML = areas.map(a => {
        const activo = seleccionadas.includes(a.id || a._id);
        return `<label class="pill-sm${activo ? ' active' : ''}" data-val="${a.id || a._id}" data-emp="${empresaId}" data-tipo="area">
          <input type="checkbox" value="${a.id || a._id}" ${activo ? 'checked' : ''}>📍 ${a.nombre}
        </label>`;
      }).join('');
      initPillsDinamicos(container, empresaId);
    } catch {
      container.innerHTML = '<span style="color:#c62828;font-size:0.83em;">Error cargando áreas.</span>';
    }
  }

  // ── Pills dinámicos ────────────────────────────────────────────────────────
  function initPillsDinamicos(container, empresaId) {
    container.querySelectorAll('.pill-sm').forEach(pill => {
      pill.addEventListener('click', function(e) {
        if (e.target.tagName === 'INPUT') return;
        const cb = this.querySelector('input');
        cb.checked = !cb.checked;
        this.classList.toggle('active', cb.checked);
        actualizarConfigPorEmpresa(empresaId);
      });
      pill.querySelector('input')?.addEventListener('change', function() {
        pill.classList.toggle('active', this.checked);
        actualizarConfigPorEmpresa(empresaId);
      });
    });
  }

  function onCampoEmpresa(empresaId, campo, valor) {
    if (!configPorEmpresa[empresaId]) configPorEmpresa[empresaId] = { rolId: '', modulos: [], areas: [], permisos: [] };
    if (campo === 'rol') configPorEmpresa[empresaId].rolId = valor;
    actualizarEmpresaCardRol(empresaId);
  }

  function actualizarConfigPorEmpresa(empresaId) {
    if (!configPorEmpresa[empresaId]) configPorEmpresa[empresaId] = { rolId: '', modulos: [], areas: [], permisos: [] };
    const get = (tipo) => Array.from(document.querySelectorAll(`[data-emp="${empresaId}"][data-tipo="${tipo}"] input:checked`)).map(cb => cb.value);
    configPorEmpresa[empresaId].modulos  = get('modulo');
    configPorEmpresa[empresaId].areas    = get('area');
    configPorEmpresa[empresaId].permisos = get('permiso');
  }

  function actualizarEmpresaCardRol(empresaId) {
    const card = document.querySelector(`.empresa-card[data-id="${empresaId}"] .emp-rol`);
    if (!card) return;
    const cfg = configPorEmpresa[empresaId];
    const rolNombre = todosLosRoles.find(r => r.id === cfg?.rolId)?.nombre || '';
    card.textContent = rolNombre ? `Rol: ${rolNombre}` : '';
  }

  // ── Modal crear ────────────────────────────────────────────────────────────
  async function abrirModalCrear() {
    modoEdicion = false;
    configPorEmpresa = {};
    document.getElementById('modal-titulo').textContent = '➕ Nuevo Usuario';
    document.getElementById('campo-id').value = '';
    document.getElementById('campo-nombre').value = '';
    document.getElementById('campo-username').value = '';
    document.getElementById('campo-correo').value = '';
    document.getElementById('campo-password').value = '';
    document.getElementById('campo-rol').value = 'usuario';
    document.getElementById('grupo-password').style.display = '';
    document.getElementById('campo-password').required = true;
    document.getElementById('grupo-estado-usuario').style.display = 'none';
    document.getElementById('acordeones-empresas').innerHTML = '';
    document.getElementById('seccion-config-empresas').style.display = 'none';
    ocultarModalAlerta();
    renderGridEmpresas([]);

    // Auto-seleccionar empresa si es admin (no super_admin)
    if (sesionActual?.rol !== 'super_admin' && sesionActual?.pgEmpresaId) {
      configPorEmpresa[sesionActual.pgEmpresaId] = { rolId: '', modulos: [], areas: [], permisos: [] };
      await crearAcordeon(sesionActual.pgEmpresaId);
      const cb = document.querySelector(`#grid-empresas input[value="${sesionActual.pgEmpresaId}"]`);
      if (cb) { cb.checked = true; cb.closest('.empresa-card')?.classList.add('selected'); }
    }
    document.getElementById('modal-usuario').classList.add('open');
  }

  // ── Modal editar ───────────────────────────────────────────────────────────
  async function abrirModalEditar(id) {
    const u = usuarios.find(x => x.id === id);
    if (!u) return;
    modoEdicion = true;
    configPorEmpresa = {};

    document.getElementById('modal-titulo').textContent = `✏️ Editar: ${u.nombre}`;
    document.getElementById('campo-id').value = u.id;
    document.getElementById('campo-nombre').value = u.nombre || '';
    document.getElementById('campo-username').value = u.username || '';
    document.getElementById('campo-correo').value = u.correo || '';
    document.getElementById('campo-password').value = '';
    document.getElementById('campo-rol').value = u.rol || 'usuario';
    document.getElementById('grupo-password').style.display = 'none';
    document.getElementById('campo-password').required = false;
    document.getElementById('grupo-estado-usuario').style.display = '';
    document.getElementById('campo-activo').value = u.activo ? 'true' : 'false';
    document.getElementById('acordeones-empresas').innerHTML = '';
    document.getElementById('seccion-config-empresas').style.display = 'none';
    ocultarModalAlerta();

    // Pre-cargar config por empresa desde datos del usuario
    const empIdsAsignadas = [];
    for (const ue of (u.empresasAsignadas || [])) {
      configPorEmpresa[ue.empresaId] = {
        rolId:    ue.rolId,
        modulos:  ue.modulos || [],
        areas:    ue.areas.map(a => a.id),
        permisos: ue.permisos || []
      };
      empIdsAsignadas.push(ue.empresaId);
    }
    renderGridEmpresas(empIdsAsignadas);
    for (const eId of empIdsAsignadas) {
      await crearAcordeon(eId);
    }

    document.getElementById('modal-usuario').classList.add('open');
  }

  function cerrarModal() {
    document.getElementById('modal-usuario').classList.remove('open');
    document.getElementById('acordeones-empresas').innerHTML = '';
    configPorEmpresa = {};
  }

  // ── Guardar usuario ────────────────────────────────────────────────────────
  async function guardarUsuario() {
    const nombre   = document.getElementById('campo-nombre').value.trim();
    const username = document.getElementById('campo-username').value.trim();
    const correo   = document.getElementById('campo-correo').value.trim();
    const password = document.getElementById('campo-password').value;
    const rol      = document.getElementById('campo-rol').value;

    if (!nombre || !username) { mostrarModalAlerta('Nombre y usuario son obligatorios.'); return; }
    if (!modoEdicion && !password) { mostrarModalAlerta('La contraseña es obligatoria.'); return; }
    if (!modoEdicion && password.length < 4) { mostrarModalAlerta('La contraseña debe tener al menos 4 caracteres.'); return; }

    // Recopilar config de cada empresa antes de enviar
    for (const empresaId of Object.keys(configPorEmpresa)) {
      actualizarConfigPorEmpresa(empresaId);
      const rolSel = document.getElementById(`rol-emp-${empresaId}`)?.value;
      if (rolSel) configPorEmpresa[empresaId].rolId = rolSel;
    }

    // Validar que cada empresa asignada tenga rol
    for (const [eId, cfg] of Object.entries(configPorEmpresa)) {
      if (!cfg.rolId) {
        const emp = todasLasEmpresas.find(e => e.id === eId);
        mostrarModalAlerta(`Selecciona un rol para la empresa "${emp?.nombre || eId}".`);
        return;
      }
    }

    const empresasPayload = Object.entries(configPorEmpresa).map(([eId, cfg]) => ({
      empresaId: eId,
      rolId:     cfg.rolId,
      modulos:   cfg.modulos,
      areas:     cfg.areas,
      permisos:  cfg.permisos
    }));

    const id = document.getElementById('campo-id').value;
    const payload = { nombre, username, correo, rol, empresas: empresasPayload };
    if (!modoEdicion) payload.password = password;

    const url    = modoEdicion ? `/api/auth/usuarios/${id}` : '/api/auth/usuarios';
    const method = modoEdicion ? 'PUT' : 'POST';
    const btn = document.getElementById('btn-guardar');
    btn.disabled = true; btn.textContent = 'Guardando...';

    try {
      const res  = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || `Error ${res.status}`);

      // Si es edición y hay empresas en payload, actualizar asignaciones
      if (modoEdicion && empresasPayload.length > 0) {
        const resEmp = await fetch(`/api/auth/usuarios/${id}/empresas`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ empresas: empresasPayload })
        });
        const dataEmp = await resEmp.json();
        if (!resEmp.ok || !dataEmp.success) throw new Error(dataEmp.error || 'Error al actualizar empresas');
      }

      cerrarModal();
      showMsg(modoEdicion ? '✅ Usuario actualizado.' : '✅ Usuario creado.', 'success');
      await cargarUsuarios();
    } catch (e) {
      mostrarModalAlerta(e.message);
    } finally {
      btn.disabled = false; btn.textContent = '💾 Guardar';
    }
  }

  // ── Toggle estado ──────────────────────────────────────────────────────────
  async function toggleEstado(id) {
    const u = usuarios.find(x => x.id === id);
    if (!confirm(`¿${u?.activo ? 'Desactivar' : 'Activar'} al usuario "${u?.username}"?`)) return;
    try {
      const res = await fetch(`/api/auth/usuarios/${id}/estado`, { method: 'PATCH' });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || `Error ${res.status}`);
      showMsg(`✅ Usuario ${data.activo ? 'activado' : 'desactivado'}.`, 'success');
      await cargarUsuarios();
    } catch (e) { showMsg('Error: ' + e.message, 'error'); }
  }

  // ── Modal contraseña ───────────────────────────────────────────────────────
  function abrirModalPass(id) {
    const u = usuarios.find(x => x.id === id);
    if (!u) return;
    document.getElementById('pass-user-id').value = u.id;
    document.getElementById('pass-titulo').textContent = `🔑 Contraseña: ${u.username}`;
    document.getElementById('pass-label').textContent = `Nueva contraseña para ${u.nombre}`;
    document.getElementById('campo-nueva-pass').value = '';
    document.getElementById('campo-conf-pass').value = '';
    document.getElementById('pass-alert').style.display = 'none';
    document.getElementById('modal-password').classList.add('open');
  }
  function cerrarModalPass() { document.getElementById('modal-password').classList.remove('open'); }

  async function guardarPassword() {
    const id   = document.getElementById('pass-user-id').value;
    const pass = document.getElementById('campo-nueva-pass').value;
    const conf = document.getElementById('campo-conf-pass').value;
    const alertEl = document.getElementById('pass-alert');
    const show = msg => { alertEl.textContent = msg; alertEl.style.display = 'block'; };
    if (!pass) { show('Ingresa la nueva contraseña.'); return; }
    if (pass.length < 4) { show('Mínimo 4 caracteres.'); return; }
    if (pass !== conf) { show('Las contraseñas no coinciden.'); return; }
    const btn = document.getElementById('btn-guardar-pass');
    btn.disabled = true; btn.textContent = 'Guardando...';
    try {
      const res = await fetch(`/api/auth/usuarios/${id}/password`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || `Error ${res.status}`);
      cerrarModalPass();
      showMsg('✅ Contraseña actualizada.', 'success');
    } catch (e) { show(e.message); }
    finally { btn.disabled = false; btn.textContent = '🔑 Cambiar'; }
  }

  // ── Eliminar usuario ───────────────────────────────────────────────────────
  async function eliminarUsuario(id) {
    const u = usuarios.find(x => x.id === id);
    if (!confirm(`⚠️ ¿Eliminar al usuario "${u?.username}"? Esta acción es irreversible.`)) return;
    try {
      const res = await fetch(`/api/auth/usuarios/${id}`, { method: 'DELETE' });
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.error || `Error ${res.status}`);
      showMsg('✅ Usuario eliminado.', 'success');
      await cargarUsuarios();
    } catch (e) { showMsg('Error: ' + e.message, 'error'); }
  }

  // ── Helpers de alertas ─────────────────────────────────────────────────────
  function showMsg(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text; el.className = 'msg ' + type; el.style.display = 'block';
    if (type === 'success') setTimeout(() => el.style.display = 'none', 4500);
  }
  function mostrarModalAlerta(msg) {
    const el = document.getElementById('modal-alert');
    el.textContent = msg; el.style.display = 'block';
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function ocultarModalAlerta() { document.getElementById('modal-alert').style.display = 'none'; }

  document.getElementById('modal-usuario').addEventListener('click',  e => { if (e.target === e.currentTarget) cerrarModal(); });
  document.getElementById('modal-password').addEventListener('click', e => { if (e.target === e.currentTarget) cerrarModalPass(); });

  // ── Init ───────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    const sesion = await verificarSesion();
    if (!sesion) return;
    await Promise.all([cargarUsuarios(), cargarEmpresas(), cargarRoles(), cargarPermisos()]);
  });
</script>
</body>
</html>
